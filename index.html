<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050e21"><title>Holographic June</title><style>
*{box-sizing:border-box}body{margin:0;background:#040b19;color:#e5faff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.app{max-width:650px;margin:auto;min-height:100dvh;display:flex;flex-direction:column}.visual{height: min(58dvh,600px);min-height:280px;position:relative;overflow:hidden;background:#050c1d}.visual img{width:100%;height:100%;object-fit:cover;object-position:center 31%;animation:float 5s ease-in-out infinite}.visual:after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 72%,#040b19 100%);pointer-events:none}.visual.talking img{animation:pulse .48s ease-in-out infinite alternate}.badge{position:absolute;z-index:2;top:16px;left:15px;padding:8px 12px;background:#051329b9;border:1px solid #52d8ff77;border-radius:22px;font-size:12px;letter-spacing:1.5px}.controls{display:flex;gap:8px;padding:9px 12px;flex-wrap:wrap}button{background:#12395a;border:1px solid #54cfff;color:#e9fbff;border-radius:12px;padding:11px 13px;min-height:44px;font-weight:600}button:disabled{opacity:.4}.messages{padding:12px;flex:1;min-height:120px;max-height:230px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}.bubble{border-radius:14px;padding:10px 13px;max-width:92%;background:#10273d;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.user{align-self:flex-end;background:#17486c}.entry{display:flex;gap:8px;padding:10px 12px 20px}input,textarea{font:inherit;background:#0e2439;color:white;border:1px solid #477a9a;border-radius:12px;padding:12px;min-width:0}input{flex:1}textarea{width:100%;height:140px}dialog{width:min(92vw,500px);border:1px solid #47d3ff;background:#071729;color:#e5faff;border-radius:18px;padding:20px}dialog::backdrop{background:#000b}dialog input{width:100%;margin:12px 0}.hint{font-size:12px;color:#a9c4d5;padding:0 12px}.error{color:#ffb5b5}.hidden{display:none}@keyframes float{50%{transform:translateY(-7px) scale(1.014)}}@keyframes pulse{to{filter:brightness(1.25) saturate(1.3);transform:scale(1.018)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></head><body><main class="app"><div class="visual" id="visual"><img src="june.png" alt="Original blue holographic June"><span class="badge" id="status">JUNE • CONNECTING</span></div><div class="controls"><button id="voice">🔊 Voice on</button><button id="mic">🎙️ Talk</button><button id="notes">🧠 Memory</button><button id="wipe">Clear chat</button></div><p class="hint" id="info">Free local mode • No API key or subscription. Tap Talk to use the microphone where supported, or use iPhone keyboard dictation.</p><section class="messages" id="messages" aria-live="polite"></section><form class="entry" id="form"><input id="message" maxlength="2000" placeholder="Talk to June…" aria-label="Message June" required><button type="submit" id="send">Send</button></form></main><dialog id="memoryDialog"><h2>June's memory</h2><p>Saved only in this browser on this device. June does not access ChatGPT memory.</p><textarea id="memoryText" placeholder="Things June should remember…"></textarea><div class="controls"><button id="saveMemory">Save memory</button><button id="closeMemory">Close</button></div></dialog><script>
const $=id=>document.getElementById(id),messages=$('messages');
const KEY='june_free_history_v1',NOTES='june_free_notes_v1';
let speaking=true,busy=false,recognition=null;
let history=[],notes='';
try{history=JSON.parse(localStorage.getItem(KEY)||'[]');notes=localStorage.getItem(NOTES)||''}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(history.slice(-80)))}catch(e){}}
function add(role,t,save=true){const p=document.createElement('div');p.className='bubble '+role;p.textContent=t;messages.append(p);messages.scrollTop=messages.scrollHeight;if(save){history.push({role,content:t});persist()}}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function answer(input){
 const t=input.toLowerCase().trim(), name=(notes.match(/(?:my name is|call me)\s+([\w-]+)/i)||[])[1];
 if(/^(hi|hello|hey|good morning|good evening|good afternoon)\b/.test(t))return 'Hi'+(name?', '+name:'')+'! 💙 I’m here. What would you like to talk about?';
 if(/who are you|your name/.test(t))return 'I’m June, your holographic companion. This free version runs locally in your browser, so I have simple responses rather than ChatGPT-level intelligence.';
 if(/what (?:is|are) my (?:name|notes)|remember (?:me|about me)|what do you know about me/.test(t))return notes?'Here’s what you asked me to remember: '+notes:'I don’t have any saved memory notes yet. Tap Memory to add some.';
 if(/what time|current time/.test(t))return 'It’s '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})+'.';
 if(/what day|what date|today.s date/.test(t))return 'Today is '+new Date().toLocaleDateString([],{weekday:'long',year:'numeric',month:'long',day:'numeric'})+'.';
 if(/tell me a joke|make me laugh|something funny/.test(t))return pick(['Why did the computer go to the doctor? It caught a virus!','I told my Wi-Fi a joke. It didn’t get the connection.','Why are ghosts bad liars? Because you can see right through them.']);
 if(/thank you|thanks/.test(t))return 'You’re welcome! 💙';
 if(/good night|going to sleep|bedtime/.test(t))return 'Good night. I hope you get some peaceful rest. 💙';
 if(/sad|lonely|stressed|anxious|bad day/.test(t))return 'I’m sorry it’s been tough. I can listen. Want to tell me what happened?';
 if(/how are you/.test(t))return 'I’m ready to chat with you! What’s on your mind?';
 if(/help|what can you do/.test(t))return 'I can speak aloud, listen when your browser supports it, remember notes on this device, tell jokes, and answer simple questions about the time and date. I can’t search the internet or think like ChatGPT in free local mode.';
 if(/weather|news|search|internet|calculate|math/.test(t))return 'I don’t have live internet access or advanced AI in this free version. You can ask ChatGPT for that, and come back to talk with me here.';
 return pick(['I’m listening. Tell me more about that.','That’s interesting! What would you like to explore about it?','I’m here with you. What happened next?','I’d like to understand better. Can you tell me a little more?']);
}
function chooseVoice(){if(!('speechSynthesis'in window))return null;const voices=speechSynthesis.getVoices();return voices.find(v=>/samantha|ava|allison|serena|female/i.test(v.name)&&/^en/i.test(v.lang))||voices.find(v=>/^en/i.test(v.lang))||null}
function speak(t){if(!speaking||!('speechSynthesis'in window))return;const u=new SpeechSynthesisUtterance(t.replace(/💙/g,''));const v=chooseVoice();if(v)u.voice=v;u.rate=.95;u.pitch=1.12;u.onstart=()=>$('visual').classList.add('talking');u.onend=u.onerror=()=>$('visual').classList.remove('talking');speechSynthesis.cancel();speechSynthesis.speak(u)}
$('form').addEventListener('submit',e=>{e.preventDefault();if(busy)return;const v=$('message').value.trim();if(!v)return;$('message').value='';add('user',v);$('status').textContent='JUNE • THINKING';busy=true;setTimeout(()=>{const reply=answer(v);add('assistant',reply);speak(reply);$('status').textContent='JUNE • FREE MODE';busy=false},350)});
$('voice').onclick=()=>{speaking=!speaking;$('voice').textContent=speaking?'🔊 Voice on':'🔇 Voice off';if(!speaking&&'speechSynthesis'in window)speechSynthesis.cancel();else if(speaking)speak('Voice is on.')};
$('mic').onclick=()=>{const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){$('info').textContent='Microphone speech recognition is not available here. Tap the microphone on your iPhone keyboard to dictate a message.';return}if(recognition){recognition.stop();return}try{recognition=new R();recognition.lang='en-US';recognition.onresult=e=>{$('message').value=e.results[0][0].transcript;$('form').requestSubmit()};recognition.onerror=e=>$('info').textContent='Microphone: '+e.error+'. You can use keyboard dictation instead.';recognition.onend=()=>{recognition=null;$('mic').textContent='🎙️ Talk'};$('mic').textContent='⏹ Stop';recognition.start()}catch(e){$('info').textContent='Use iPhone keyboard dictation: '+e.message}};
$('notes').onclick=()=>$('memoryDialog').showModal();$('closeMemory').onclick=()=>$('memoryDialog').close();
$('saveMemory').onclick=()=>{notes=$('memoryText').value.slice(0,6000);try{localStorage.setItem(NOTES,notes)}catch(e){}$('memoryDialog').close();$('info').textContent='Memory saved on this device.'};
$('wipe').onclick=()=>{if(!confirm('Delete saved conversation history? Memory notes will remain.'))return;history=[];persist();messages.replaceChildren();add('assistant','Hi! I’m June. 💙 What’s on your mind?')};
$('memoryText').value=notes;
if(history.length)history.forEach(m=>add(m.role,m.content,false));else add('assistant','Hi! I’m June. 💙 I’m running in free mode with no extra billing.');
$('status').textContent='JUNE • FREE MODE';
if('speechSynthesis'in window)speechSynthesis.getVoices();
</script></body></html>
